[package]
name = "docufinder"
version = "3.3.1"
description = "로컬 문서 검색 앱 - HWPX, Office, PDF 지원"
authors = ["Chris"]
edition = "2021"

[lib]
name = "docufinder_lib"
# 데스크톱(Windows MSI/macOS) 전용 — staticlib/cdylib은 모바일 타깃용이라 제외
# (staticlib은 릴리즈 빌드마다 756MB 아카이브를 생성했음)
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "^2.5", features = [] }

[dependencies]
# Tauri 프레임워크 (^2.10: tauri 2.10.2+)
tauri = { version = "^2.10", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "^2.6"
# tauri-plugin-fs = "^2.4"  # 프론트엔드에서 미사용 (capabilities 미부여)
tauri-plugin-autostart = "^2.5"
tauri-plugin-single-instance = "^2"
tauri-plugin-window-state = "^2.4"
# 자동 업데이트 (GitHub Releases + ed25519)
tauri-plugin-updater = "^2.9"
# relaunch() — 업데이트 설치 후 재시작
tauri-plugin-process = "^2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.37", features = ["bundled"] }

# File parsing
# 읽기 전용(HWPX/DOCX 해제) — 표준 deflate만 필요, AES/bzip2/zstd/lzma 등 기본 코덱 제외
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
calamine = "0.35"  # Excel
pdf-extract = "0.7"  # PDF
lopdf = "0.34"  # PDF 임베디드 이미지 추출 (스캔 PDF OCR용, pdf-extract와 버전 일치)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff"] }
flate2 = "1"  # PDF 이미지 스트림 디코딩 (FlateDecode) + pdfium tgz 압축 해제(gzip)
# 스캔/이미지 PDF 페이지 래스터화 → OCR fallback. CCITTFax/JBIG2/JPX/CMYK 등 임베디드
# 이미지 추출이 실패하는 코덱을 페이지 통째 렌더로 우회. libpdfium 은 런타임 동적 로드
# (PDFIUM_DYLIB_PATH env, onnxruntime 와 동일 패턴) — bundled 정적 링크 금지.
# image_025 로 repo 의 image 0.25 와 단일 버전 유지.
pdfium-render = { version = "0.8.37", default-features = false, features = ["image_025", "thread_safe", "pdfium_latest"] }
# .eml 메일 (이슈 #29) — RFC822 MIME 파싱. full_encoding: EUC-KR/CP949 등 한국 메일 charset 디코딩
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }

# HWP5(.hwp) 바이너리 원본 레이아웃 미리보기 — rhwp(순수 Rust HWP/HWPX 뷰어) DocumentCore→SVG.
# 미리보기 "원본 레이아웃" 뷰 전용 (인덱싱/마크다운은 kordoc 담당). native-skia(C++) feature 는
# 켜지 않는다 — render_page_svg_native 는 순수 Rust(tiny-skia) 경로라 C++ 링크 없이 Win/macOS 컴파일.
# rev 는 v0.7.17 태그 커밋 SHA 고정 (공급망 차단, kordoc SHA-pin 정책과 동일).
rhwp = { git = "https://github.com/edwardkim/rhwp", rev = "03351190ec35436e58cbfee0aa9278a8fdc04a59", default-features = false }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }

# File watching
notify = "8"
walkdir = "2"
# Windows UNC/extended-length 경로(\\?\, \\?\UNC\) 정규화
dunce = "1"
# .gitignore 파싱 (ripgrep에서 사용하는 공식 구현체)
ignore = "0.4"

# Semantic search (Phase 3) - 버전 고정
# load-dynamic: 런타임에 ORT_DYLIB_PATH로 onnxruntime.dll 로드 (lib.rs setup에서 설정).
# download-binaries는 빌드 시 DLL을 또 받아 재현성을 훼손하므로 사용하지 않는다.
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
# NOTE: ort 2.0.1 정식 버전 출시 시 업그레이드 권장 (현재 RC가 최신)
usearch = "2.23"
tokenizers = { version = "0.19", default-features = false, features = ["onig"] }

# Korean morphological analysis (Phase 5)
lindera = { version = "2.0", features = ["embed-ko-dic", "compress"] }

# HTTP client for model download + LLM API
ureq = { version = "3", features = ["json"] }

# SHA-256 무결성 검증
sha2 = "0.10"

# Base64 (PowerShell EncodedCommand)
base64 = "0.22"

# Text encoding detection (EUC-KR, CP949 etc.)
encoding_rs = "0.8"

# Unicode NFC 정규화 (인덱싱/검색 텍스트 매칭 통일 — utils::normalize_text)
unicode-normalization = "0.1"

# Regex (파일명 정규화 — lineage 추론)
regex = "1"

# Utilities
which = "7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
once_cell = "1"
chrono = "0.4"
dirs = "6"  # 크래시 로그 저장 경로

# Parallel processing
rayon = "1.10"
crossbeam-channel = "0.5"
tauri-plugin-drag = "2.1.1"

[dev-dependencies]
tempfile = "3"

# Windows APIs
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    # 이슈 #29: 매핑 드라이브→UNC 해석(레지스트리/WNet) + elevation 감지(토큰)
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_NetworkManagement_WNet",
    # 이슈 #33: kordoc Node 사이드카 자식을 Job Object 에 묶어 앱 종료/크래시 시 자동 정리
    "Win32_System_JobObjects"
] }
# Fixed-version WebView2 Runtime 지원 (이슈 #24): registry 미등록 환경에서도
# EBWebView 폴더만 있으면 ICoreWebView2Environment 를 직접 만들어 wry 에 inject.
# 버전은 wry 0.54.1 가 transitively 끌어오는 것과 동일 (Cargo.lock 의 webview2-com 0.38.2)
# 을 맞춰 single-version 유지.
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
panic = "unwind"        # catch_unwind 활성화 (PDF/XLSX 파서 안정성 필수)
codegen-units = 4       # 병렬 코드젠 (메모리 사용 분산)
lto = "thin"            # Thin LTO (Full 대비 메모리 절반, 성능 차이 미미)
opt-level = 3
# strip = "debuginfo"   # v2.5.17 한정 비활성화 — issue #17 fastfail 콜스택 추적용 PDB 보존
debug = "line-tables-only" # 백트레이스에 file:line 노출 (PDB 사이즈 최소화)
